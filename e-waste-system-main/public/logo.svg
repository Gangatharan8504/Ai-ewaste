<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#059669" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Glow Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#glowGrad)" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Outer Recycling Triangular Circuit Loop -->
  <g filter="url(#shadow)">
    <!-- Top Arc & Arrow -->
    <path d="M 50 12 C 68 12 83 24 87 40" stroke="url(#circuitGrad)" stroke-width="5" stroke-linecap="round" />
    <polygon points="84,42 92,38 88,30" fill="#10B981" />

    <!-- Right Arc & Arrow -->
    <path d="M 87 58 C 82 76 67 87 50 88" stroke="url(#circuitGrad)" stroke-width="5" stroke-linecap="round" />
    <polygon points="48,92 52,84 44,84" fill="#059669" />

    <!-- Left Arc & Arrow -->
    <path d="M 36 84 C 20 76 13 60 13 46 C 13 32 24 18 40 13" stroke="url(#circuitGrad)" stroke-width="5" stroke-linecap="round" />
    <polygon points="42,10 38,18 46,18" fill="#34D399" />
  </g>

  <!-- Central E-Waste Leaf & Microchip Node -->
  <!-- Left Side: Organic Leaf -->
  <path d="M 50 24 C 34 32 30 52 50 76 C 50 76 46 54 50 24 Z" fill="url(#leafGrad)" />

  <!-- Right Side: Tech Circuit Lines & Nodes -->
  <!-- Circuit Stem & Branches -->
  <path d="M 50 28 L 50 72" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Branch 1 (Top Right) -->
  <path d="M 50 38 L 62 38 L 68 32" stroke="#047857" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="68" cy="32" r="3.5" fill="#06B6D4" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- Branch 2 (Mid Right) -->
  <path d="M 50 50 L 65 50" stroke="#047857" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="67" cy="50" r="3.5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- Branch 3 (Bottom Right) -->
  <path d="M 50 62 L 60 62 L 66 68" stroke="#047857" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="66" cy="68" r="3.5" fill="#34D399" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- Central Energy Core Dot -->
  <circle cx="50" cy="50" r="4.5" fill="#FFFFFF" />
  <circle cx="50" cy="50" r="2.5" fill="#047857" />
</svg>
